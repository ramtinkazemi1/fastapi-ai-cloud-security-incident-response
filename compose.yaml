# pg_isready asks PostgreSQL whether it accepts connections.
# -U incident_app checks using our database user.
# -d incident_response targets our database.
# interval runs the check every five seconds.
# timeout fails an individual check after five seconds.
# retries marks the service unhealthy after five failures.
# start_period gives PostgreSQL time to initialize before failures count.


services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: incident_response
      POSTGRES_USER: incident_app
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U incident_app -d incident_response
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
