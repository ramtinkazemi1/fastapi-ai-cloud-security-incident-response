services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: incident_response
      POSTGRES_USER: incident_app
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U incident_app -d incident_response
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    build: .
    environment:
      CIR_DATABASE_URL: >-
        postgresql+asyncpg://incident_app:local-development-only@postgres:5432/incident_response
      CIR_API_KEY: ${CIR_API_KEY:-local-development-api-key}
      CIR_JWT_SECRET: ${CIR_JWT_SECRET:-local-development-jwt-secret-change-me}
      CIR_OPENAI_API_KEY: ${CIR_OPENAI_API_KEY:-}
      CIR_OPENAI_MODEL: ${CIR_OPENAI_MODEL:-gpt-4.1-mini}
    command:
      - sh
      - -c
      - uv run alembic upgrade head &&
        uv run uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/ready')
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
